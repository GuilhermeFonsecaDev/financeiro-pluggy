<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Regras</title>
<link rel="stylesheet" href="tema.css" />
<style>
.regra { display: grid; grid-template-columns: 30px 1fr 120px 44px 34px; gap: 12px; align-items: center; padding: 12px 8px; border-bottom: 1px solid var(--line); }
.regra:last-child { border-bottom: 0; }
.regra:hover { background: var(--surface-2); }
.regra.off { opacity: .45; }
.ordem { color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; text-align: center; }
.regra-nome { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
.regra-cond { margin-top: 2px; color: var(--text-3); font-size: 12.5px; }
.regra-cond b { color: var(--text-2); font-weight: 600; }
.termo { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); }
.afeta { text-align: right; color: var(--text-2); font-size: 12.5px; font-variant-numeric: tabular-nums; }

/* Interruptor: alvo pequeno, estado óbvio pela cor e pela posição. */
.switch { position: relative; width: 34px; height: 19px; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--line-forte); transition: background .14s ease; }
.switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 999px; background: var(--text-3); transition: transform .14s ease, background .14s ease; }
.switch input:checked + span { background: var(--azul); border-color: var(--azul); }
.switch input:checked + span::after { transform: translateX(15px); background: #fff; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
.dinheiro-input { display:flex; align-items:center; width:100%; min-height:31px; border:1px solid var(--line-forte); border-radius:8px; background:var(--surface-2); overflow:hidden; }
.dinheiro-input:focus-within { border-color:var(--azul); box-shadow:0 0 0 2px rgba(74,149,234,.10); }
.dinheiro-input > span { padding-left:9px; color:var(--text-3); font-size:12px; }
.dinheiro-input input { flex:1; min-width:0; border:0; border-radius:0; outline:0; background:transparent; box-shadow:none; }
.dinheiro-input input:focus { border:0; outline:0; box-shadow:none; }
.termos-topo { display:flex; align-items:center; margin-bottom:6px; }
.termos-topo > span { color:var(--text-3); font-size:12px; }
.termo-add { display:block; width:100%; height:34px; min-height:34px; padding:0; border:1px dashed var(--line-forte); border-radius:8px; background:transparent; color:var(--azul); font-size:12.5px; cursor:pointer; }
.termo-add:hover { border-style:solid; border-color:var(--azul); background:var(--surface-2); }
.termos-lista { display:grid; gap:7px; }
/* O input ocupa a linha toda, igual aos outros campos do formulario; o x de
   remover fica por dentro dele, e nao numa coluna que encurtava a caixa. */
.termo-linha { position:relative; }
.termo-linha input { width:100%; padding-right:34px; }
.termo-remover { position:absolute; right:5px; top:50%; transform:translateY(-50%); width:24px; height:24px; padding:0; border:0; border-radius:6px; background:transparent; color:var(--text-3); font-size:16px; line-height:1; cursor:pointer; }
.termo-remover:hover { background:var(--surface-3); color:var(--vermelho); }
/* Indicadores, abas e busca: a mesma .metrica e o mesmo .segmentado das
   outras telas, para Regras não parecer um produto à parte. */
.rg-metricas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.rg-metricas .valor { font-variant-numeric: tabular-nums; }
.rg-metricas .nota b { color: var(--text-2); font-weight: 600; }
.rg-cobertura { display: flex; height: 5px; border-radius: 999px; overflow: hidden; margin-top: 9px; background: var(--surface-3); }
.rg-cobertura i { display: block; height: 100%; }
.rg-barra { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.rg-barra .segmentado button small { margin-left: 6px; opacity: .7; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.rg-busca { flex: 1; min-width: 220px; position: relative; }
.rg-busca input { width: 100%; padding-left: 30px; }
.rg-busca svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.rg-nada { padding: 26px 8px; text-align: center; color: var(--text-3); font-size: 13px; }
.regra mark { background: rgba(74, 149, 234, .24); color: inherit; border-radius: 3px; padding: 0 1px; }
.regra.leitura { grid-template-columns: 30px 1fr 120px 78px; }
.selo-sis { justify-self: end; font-size: 10.5px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase;
            color: var(--text-3); border: 1px solid var(--line-forte); border-radius: 999px; padding: 2px 8px; }

/* Prévia no modal: o que a regra faria, antes de salvar. */
.rg-previa { margin-top: 14px; border: 1px solid var(--line); border-radius: var(--raio); background: var(--surface-2); }
.rg-previa-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 9px 12px;
                  border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--text-2); }
.rg-previa-topo b { color: var(--text); font-variant-numeric: tabular-nums; }
.rg-previa-lista { max-height: 230px; overflow: auto; }
.rg-previa-item { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center;
                  padding: 7px 12px; border-top: 1px solid var(--line); font-size: 12px; }
.rg-previa-item:first-child { border-top: 0; }
.rg-previa-item .quando { color: var(--text-3); font-variant-numeric: tabular-nums; }
.rg-previa-item .de { color: var(--text-3); text-decoration: line-through; }
.rg-previa-item .desc { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rg-previa-item .val { font-variant-numeric: tabular-nums; color: var(--text-2); white-space: nowrap; }
.rg-previa-msg { padding: 12px; color: var(--text-3); font-size: 12.5px; }

@media (max-width: 900px) {
  .rg-metricas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .regra { grid-template-columns: 30px 1fr 34px; }
  .afeta, .switch { display: none; }
  .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<nav class="nav"></nav>

<main class="container">
  <header class="topo">
    <div>
      <h1>Regras</h1>
      <p class="sub" id="notaSistema"></p>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="estado" id="estado">Carregando…</span>
      <button class="primario" id="btnNova">+ Nova regra</button>
    </div>
  </header>

  <section class="rg-metricas" id="metricas" aria-label="Resumo das regras"></section>

  <div class="rg-barra">
    <span class="segmentado" id="abas" role="tablist" aria-label="Tipo de regra"></span>
    <label class="rg-busca">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="busca" type="search" placeholder="Buscar por nome, termo, categoria ou nova descrição" autocomplete="off" aria-label="Buscar regras" />
    </label>
  </div>

  <section class="painel" style="padding:6px 10px">
    <div id="lista"></div>
    <div id="vazio"></div>
  </section>
</main>

<div class="pop" id="popAcoes" hidden style="min-width:190px">
  <div class="pop-lista" id="popAcoesLista"></div>
</div>

<div class="modal-fundo" id="modal" hidden>
  <div class="modal">
    <div class="modal-tit">
      <h2 id="modalTitulo">Nova regra</h2>
      <button class="icone" id="btnFechar" aria-label="Fechar">×</button>
    </div>

    <div class="form-grid">
      <label class="campo full"><span>Nome</span>
        <input id="fNome" type="text" placeholder="ex.: Mercado do bairro" autocomplete="off" /></label>

      <label class="campo"><span>Quando</span>
        <select id="fCampo">
          <option value="descricao">A descrição</option>
          <option value="categoria_original">A categoria da Pluggy</option>
        </select></label>

      <label class="campo"><span>Condição</span>
        <select id="fOperador">
          <option value="contem">contém</option>
          <option value="comeca_com">começa com</option>
          <option value="igual">é igual a</option>
        </select></label>

      <div class="campo full">
        <div class="termos-topo"><span>Termos</span></div>
        <div class="termos-lista" id="fTermos"></div>
        <button type="button" class="termo-add" id="btnAddTermo" data-add-termo
                style="margin-top:7px">+ Adicionar termo</button>
      </div>

      <label class="campo"><span>Valor mínimo <small>(opcional)</small></span>
        <span class="dinheiro-input"><span>R$</span><input id="fValorMin" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off" /></span></label>

      <label class="campo"><span>Valor máximo <small>(opcional)</small></span>
        <span class="dinheiro-input"><span>R$</span><input id="fValorMax" type="text" inputmode="decimal" placeholder="sem limite" autocomplete="off" /></span></label>

      <label class="campo full"><span>Renomear descrição para</span>
        <input id="fDescricaoNova" type="text" placeholder="Opcional — ex.: PADARIA DA ESQUINA" autocomplete="off" /></label>

      <label class="campo"><span>Categoria</span><select id="fCategoria"></select></label>

      <label class="campo"><span>Prioridade</span>
        <input id="fPrioridade" type="number" value="100" min="1" max="999" /></label>

      <div class="full" style="display:flex;gap:18px;flex-wrap:wrap">
        <label class="check"><input id="fIgnorar" type="checkbox" /> Tirar dos cálculos</label>
        <label class="check"><input id="fAtivo" type="checkbox" checked /> Regra ativa</label>
      </div>
    </div>

    <div class="rg-previa" aria-live="polite">
      <div class="rg-previa-topo"><span>Prévia</span><span id="previaTotal"></span></div>
      <div class="rg-previa-lista" id="previaLista"></div>
    </div>

    <p class="muted" style="margin:14px 0 0;font-size:12.5px">
      A comparação ignora maiúsculas, minúsculas e acentos. A faixa inclui os limites e usa o valor absoluto da transação. Prioridade menor é aplicada primeiro.
    </p>
    <p class="estado erro" id="modalErro" style="margin:8px 0 0"></p>

    <div class="modal-rodape">
      <button class="sutil" id="btnCancelar">Cancelar</button>
      <button class="primario" id="btnSalvar">Criar regra</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
const OPERADORES = { contem: "contém", comeca_com: "começa com", igual: "é igual a" };
const CAMPOS = { descricao: "a descrição", categoria_original: "a categoria da Pluggy" };

let CATEGORIAS = [], REGRAS = [], SISTEMA = [], ENTRADAS = [], COBERTURA = {};
let aba = "todas", busca = "";

/* Uma regra entra em toda aba cuja ação ela faz: a que renomeia e
   categoriza aparece nas duas. */
const ABAS = [
  { id: "todas",     rotulo: "Todas",      filtro: () => true },
  { id: "renomear",  rotulo: "Renomeação", filtro: r => !!r.descricaoNova },
  { id: "categoria", rotulo: "Categoria",  filtro: r => !!r.categoriaId },
  { id: "ignorar",   rotulo: "Ignorar",    filtro: r => r.ignorarCalculos },
  { id: "entradas",  rotulo: "Entradas" },
  { id: "sistema",   rotulo: "Sistema" },
];
const DESLOCAMENTO = { "-1": "mês anterior", "0": "mesmo mês", "1": "mês seguinte" };
let editando = null, regraDoMenu = null;

const el = id => document.getElementById(id);
const fmtValorRegra = valor => valor == null ? "" : Number(valor).toLocaleString("pt-BR", { minimumFractionDigits:2, maximumFractionDigits:2 });
const lerValorRegra = texto => {
  const limpo = String(texto ?? "").replace(/R\$\s?/g, "").trim();
  if (!limpo) return null;
  const numero = Number(limpo.replace(/\./g, "").replace(",", "."));
  return Number.isFinite(numero) ? numero : NaN;
};
const textoFaixa = regra => {
  if (regra.valorMin != null && regra.valorMax != null) return `de ${fmtBRL(regra.valorMin)} a ${fmtBRL(regra.valorMax)}`;
  if (regra.valorMin != null) return `a partir de ${fmtBRL(regra.valorMin)}`;
  if (regra.valorMax != null) return `até ${fmtBRL(regra.valorMax)}`;
  return "";
};

function criarLinhaTermo(valor = "", removivel = true) {
  const linha = document.createElement("div");
  linha.className = "termo-linha";
  const input = document.createElement("input");
  input.type = "text";
  input.className = "f-termo";
  input.placeholder = "ex.: RLRSOARES";
  input.autocomplete = "off";
  input.setAttribute("aria-label", "Termo da regra");
  input.value = valor;
  linha.appendChild(input);
  if (removivel) {
    const remover = document.createElement("button");
    remover.type = "button";
    remover.className = "termo-remover";
    remover.dataset.removeTermo = "";
    remover.title = "Remover termo";
    remover.setAttribute("aria-label", "Remover termo");
    remover.textContent = "×";
    linha.appendChild(remover);
  }
  el("fTermos").appendChild(linha);
  return input;
}

function preencherTermos(valores = [""]) {
  const termos = valores.filter(v => v != null);
  el("fTermos").innerHTML = "";
  (termos.length ? termos : [""]).forEach(valor => criarLinhaTermo(valor, true));
}

function termosAtuais() {
  return [...document.querySelectorAll(".f-termo")]
    .map(input => input.value.trim()).filter(Boolean);
}

const normal = t => String(t ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

/* Destaca o trecho buscado. A posição sai do texto normalizado, que tem o
   mesmo tamanho do original quando não há caractere composto; se tiver,
   só não destaca. */
function marcar(texto) {
  const bruto = String(texto ?? "");
  const q = normal(busca.trim());
  const n = normal(bruto);
  const i = q ? n.indexOf(q) : -1;
  if (i < 0 || n.length !== bruto.length) return esc(bruto);
  return esc(bruto.slice(0, i)) + "<mark>" + esc(bruto.slice(i, i + q.length)) + "</mark>"
    + esc(bruto.slice(i + q.length));
}

function casaBusca(...campos) {
  const q = normal(busca.trim());
  return !q || campos.flat().some(c => normal(c).includes(q));
}

function renderMetricas() {
  const ativas = REGRAS.filter(r => r.ativo).length;
  const semEfeito = REGRAS.filter(r => r.ativo && !r.afetadas).length;
  const total = Object.values(COBERTURA).reduce((a, b) => a + b, 0) || 1;
  const pct = k => Math.round(100 * (COBERTURA[k] || 0) / total);
  const faixas = [["regra", "var(--azul)"], ["manual", "var(--verde)"],
                  ["pluggy", "var(--text-3)"], ["padrao", "var(--laranja)"]];
  el("metricas").innerHTML = `
    <div class="metrica"><div class="rotulo">Regras ativas</div>
      <div class="valor">${ativas}</div>
      <div class="nota">de ${REGRAS.length} · mais ${SISTEMA.length} de sistema</div></div>
    <div class="metrica"><div class="rotulo">Categorizadas por regra</div>
      <div class="valor">${pct("regra")}%</div>
      <div class="rg-cobertura" title="Regra · manual · Pluggy · sem categoria">${faixas.map(([k, cor]) =>
        `<i style="width:${100 * (COBERTURA[k] || 0) / total}%;background:${cor}"></i>`).join("")}</div>
      <div class="nota" title="Sem categoria: ${pct("padrao")}%">manual <b>${pct("manual")}%</b> · Pluggy <b>${pct("pluggy")}%</b></div></div>
    <div class="metrica"><div class="rotulo">Sem efeito</div>
      <div class="valor" style="${semEfeito ? "color:var(--laranja)" : ""}">${semEfeito}</div>
      <div class="nota">ativas que não pegam nenhuma transação</div></div>
    <div class="metrica"><div class="rotulo">Regras de entrada</div>
      <div class="valor">${ENTRADAS.filter(e => e.ativo).length}</div>
      <div class="nota">reconhecem o que compõe a renda</div></div>`;
}

function renderAbas() {
  const conta = a => a.id === "entradas" ? ENTRADAS.length
    : a.id === "sistema" ? SISTEMA.length : REGRAS.filter(a.filtro).length;
  el("abas").innerHTML = ABAS.map(a =>
    `<button type="button" role="tab" data-aba="${a.id}" aria-selected="${a.id === aba}"
       class="${a.id === aba ? "ativo" : ""}">${a.rotulo}<small>${conta(a)}</small></button>`).join("");
}

function semResultado(texto) {
  el("lista").innerHTML = "";
  el("vazio").innerHTML = `<div class="rg-nada">${texto}</div>`;
}

function renderEntradas() {
  const lista = ENTRADAS.filter(e => casaBusca(e.nome, e.termo));
  if (!lista.length) {
    return semResultado(busca ? "Nenhuma regra de entrada com esse texto." : "Nenhuma regra de entrada. Crie em Entradas.");
  }
  el("vazio").innerHTML = "";
  el("lista").innerHTML = lista.map((e, i) => `
    <div class="regra leitura ${e.ativo ? "" : "off"}">
      <span class="ordem">${i + 1}</span>
      <div>
        <div class="regra-nome">${marcar(e.nome)}</div>
        <div class="regra-cond">Quando <b>a descrição</b> ${esc(OPERADORES[e.operador] || e.operador)}
          <span class="termo">“${marcar(e.termo)}”</span> · entre os dias ${e.diaInicio} e ${e.diaFim}
          · conta no ${esc(DESLOCAMENTO[String(e.deslocamentoMeses)] || "mesmo mês")}</div>
      </div>
      <span class="afeta">${e.ativo ? "ativa" : "desativada"}</span>
      <a class="btn sutil" href="entradas.html" style="justify-self:end">Editar</a>
    </div>`).join("");
}

function renderSistema() {
  const lista = SISTEMA.filter(r => casaBusca(r.nome, r.termos, r.categoriaNome));
  if (!lista.length) return semResultado("Nenhuma regra de sistema com esse texto.");
  el("vazio").innerHTML = "";
  el("lista").innerHTML = lista.map((r, i) => `
    <div class="regra leitura">
      <span class="ordem">${i + 1}</span>
      <div>
        <div class="regra-nome">${marcar(r.nome)}</div>
        <div class="regra-cond">Quando <b>${esc(CAMPOS[r.campo] || r.campo)}</b> ${esc(OPERADORES[r.operador] || r.operador)}
          <span class="termo">${r.termos.map(t => `“${marcar(t)}”`).join(" ou ")}</span></div>
        <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
          ${r.categoriaNome ? `<span class="chip"><span class="ponto" style="background:${esc(r.categoriaCor || "#9ba1ab")}"></span>${esc(r.categoriaNome)}</span>` : ""}
          ${r.ignorarCalculos ? `<span class="chip aviso">fora dos cálculos</span>` : ""}</div>
      </div>
      <span class="afeta">${r.afetadas} transaç${r.afetadas === 1 ? "ão" : "ões"}</span>
      <span class="selo-sis" title="Sustenta os cálculos; não é editável">sistema</span>
    </div>`).join("");
}

function render() {
  renderMetricas();
  renderAbas();
  if (aba === "entradas") return renderEntradas();
  if (aba === "sistema") return renderSistema();
  const alvo = el("lista");
  if (!REGRAS.length) return semResultado("Nenhuma regra ainda. Crie a primeira em “Nova regra”.");
  const filtro = ABAS.find(a => a.id === aba)?.filtro || (() => true);
  const lista = REGRAS.filter(filtro).filter(r =>
    casaBusca(r.nome, r.termos, r.categoriaNome, r.descricaoNova));
  if (!lista.length) {
    return semResultado(busca ? `Nenhuma regra com “${esc(busca)}”.` : "Nenhuma regra deste tipo.");
  }
  el("vazio").innerHTML = "";
  alvo.innerHTML = lista.map(r => {
    const cat = r.categoriaId
      ? `<span class="chip"><span class="ponto" style="background:${esc(r.categoriaCor || "#9ba1ab")}"></span>${esc(r.categoriaNome || r.categoriaId)}</span>`
      : `<span class="muted" style="font-size:12.5px">mantém a categoria</span>`;
    const fora = r.ignorarCalculos ? `<span class="chip aviso">fora dos cálculos</span>` : "";
    const renomeia = r.descricaoNova
      ? `<span class="chip">renomeia para “${marcar(r.descricaoNova)}”</span>` : "";
    const faixa = textoFaixa(r);
    const termos = (r.termos?.length ? r.termos : [r.termo])
      .map(termo => `“${marcar(termo)}”`).join(" ou ");
    return `
      <div class="regra ${r.ativo ? "" : "off"}">
        <span class="ordem" title="Prioridade ${r.prioridade}">${REGRAS.indexOf(r) + 1}</span>
        <div>
          <div class="regra-nome">${marcar(r.nome)}</div>
          <div class="regra-cond">Quando <b>${esc(CAMPOS[r.campo] || r.campo)}</b>
            ${esc(OPERADORES[r.operador] || r.operador)}
            <span class="termo">${termos}</span>${faixa ? ` · valor ${esc(faixa)}` : ""}</div>
          <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${cat}${renomeia}${fora}</div>
        </div>
        <span class="afeta">${r.afetadas} transaç${r.afetadas === 1 ? "ão" : "ões"}</span>
        <label class="switch" title="${r.ativo ? "Desativar" : "Ativar"}">
          <input type="checkbox" data-alterna="${esc(r.id)}" ${r.ativo ? "checked" : ""}><span></span>
        </label>
        <button class="icone" data-abre-pop data-menu="${esc(r.id)}" aria-label="Ações">⋯</button>
      </div>`;
  }).join("");
}

/* ----------------------------------------------------------------- modal */

function abrirModal(regra = null, pre = {}) {
  editando = regra?.id || null;
  el("modalTitulo").textContent = regra ? "Editar regra" : "Nova regra";
  el("btnSalvar").textContent = regra ? "Salvar" : "Criar regra";
  el("modalErro").textContent = "";

  el("fNome").value = regra?.nome ?? pre.nome ?? "";
  el("fCampo").value = regra?.campo ?? pre.campo ?? "descricao";
  el("fOperador").value = regra?.operador ?? pre.operador ?? "contem";
  preencherTermos(regra?.termos ?? pre.termos ?? [regra?.termo ?? pre.termo ?? ""]);
  el("fValorMin").value = fmtValorRegra(regra?.valorMin ?? pre.valorMin ?? null);
  el("fValorMax").value = fmtValorRegra(regra?.valorMax ?? pre.valorMax ?? null);
  el("fDescricaoNova").value = regra?.descricaoNova ?? pre.descricaoNova ?? "";
  el("fCategoria").value = regra?.categoriaId ?? pre.categoriaId ?? "";
  el("fPrioridade").value = regra?.prioridade ?? 100;
  el("fIgnorar").checked = regra ? regra.ignorarCalculos : !!pre.ignorar;
  el("fAtivo").checked = regra ? regra.ativo : true;

  el("modal").hidden = false;
  el("fTermos").querySelector("input")?.focus();
  atualizarPrevia();
}

let previaTimer = null, previaSeq = 0;

function dadosDoModal() {
  const termos = termosAtuais();
  return {
    nome: el("fNome").value.trim() || termos[0] || "",
    campo: el("fCampo").value,
    operador: el("fOperador").value,
    termo: termos[0] || "",
    termos,
    valorMin: lerValorRegra(el("fValorMin").value),
    valorMax: lerValorRegra(el("fValorMax").value),
    descricaoNova: el("fDescricaoNova").value.trim() || null,
    categoriaId: el("fCategoria").value || null,
    ignorarCalculos: el("fIgnorar").checked,
    prioridade: Number(el("fPrioridade").value) || 100,
    ativo: el("fAtivo").checked,
  };
}

function agendarPrevia() {
  clearTimeout(previaTimer);
  previaTimer = setTimeout(atualizarPrevia, 250);
}

const MSG_PREVIA = `<div class="rg-previa-msg">Digite um termo para ver quais transações a regra pega.</div>`;

async function atualizarPrevia() {
  const dados = dadosDoModal();
  const seq = ++previaSeq;
  if (!dados.termos.length) {
    el("previaTotal").textContent = "";
    el("previaLista").innerHTML = MSG_PREVIA;
    return;
  }
  el("previaTotal").textContent = "calculando…";
  try {
    const r = await pedir("/extrato/regras/previa", "POST", {
      ...dados,
      valorMin: Number.isNaN(dados.valorMin) ? null : dados.valorMin,
      valorMax: Number.isNaN(dados.valorMax) ? null : dados.valorMax,
    });
    if (seq !== previaSeq) return;   // resposta velha chegando depois da nova
    el("previaTotal").innerHTML = r.total
      ? `<b>${r.total}</b> transaç${r.total === 1 ? "ão" : "ões"} · <b>${r.mudam}</b> mudam`
      : "nenhuma transação";
    if (!r.amostra.length) {
      el("previaLista").innerHTML = `<div class="rg-previa-msg">Nenhuma transação casa com esses termos.</div>`;
      return;
    }
    const cat = c => c.categoria
      ? `<span class="chip"><span class="ponto" style="background:${esc(c.cor || "#9ba1ab")}"></span>${esc(c.categoria)}</span>`
      : `<span class="muted">sem categoria</span>`;
    el("previaLista").innerHTML = r.amostra.map(t => {
      const renomeia = t.depois.descricao !== t.antes.descricao;
      const recategoriza = t.depois.categoria !== t.antes.categoria;
      const sai = t.antes.incluida && !t.depois.incluida;
      return `<div class="rg-previa-item">
        <span class="quando">${esc(fmtData(t.data))}</span>
        <div style="min-width:0">
          <div class="desc">${renomeia
            ? `<span class="de">${esc(t.antes.descricao)}</span> → ${esc(t.depois.descricao)}`
            : esc(t.antes.descricao)}</div>
          <div style="margin-top:3px;display:flex;gap:5px;flex-wrap:wrap;align-items:center">
            ${recategoriza ? `${cat(t.antes)} → ${cat(t.depois)}` : cat(t.antes)}
            ${sai ? `<span class="chip aviso">sai dos cálculos</span>` : ""}</div>
        </div>
        <span class="val">${esc(fmtBRL(t.valor))}</span>
      </div>`;
    }).join("");
  } catch (e) {
    if (seq === previaSeq) el("previaTotal").textContent = e.message;
  }
}

function fecharModal() { el("modal").hidden = true; editando = null; }

async function salvar() {
  const dados = dadosDoModal();
  const { valorMin, valorMax } = dados;
  if (!dados.termos.length) { el("modalErro").textContent = "Informe pelo menos um termo a procurar."; return; }
  if (Number.isNaN(valorMin) || Number.isNaN(valorMax)) { el("modalErro").textContent = "Informe valores mínimo e máximo válidos."; return; }
  if (valorMin != null && valorMax != null && valorMin > valorMax) { el("modalErro").textContent = "O valor mínimo não pode ser maior que o valor máximo."; return; }

  el("btnSalvar").disabled = true;
  try {
    if (editando) await pedir(`/extrato/regras/${encodeURIComponent(editando)}`, "PUT", dados);
    else await pedir("/extrato/regras", "POST", dados);
    fecharModal();
    await recarregar();
  } catch (e) {
    el("modalErro").textContent = e.message;
  } finally {
    el("btnSalvar").disabled = false;
  }
}

async function recarregar() {
  const resposta = await pedir("/extrato/regras");
  REGRAS = resposta.regras || [];
  SISTEMA = resposta.regrasSistema || [];
  ENTRADAS = resposta.entradas || [];
  COBERTURA = resposta.cobertura || {};
  const sistema = resposta.sistema || 0;
  el("notaSistema").textContent = "Renomeiam, categorizam e tiram transações dos cálculos."
    + (sistema ? ` ${sistema} regras de sistema rodam sempre e ficam na aba Sistema.` : "");
  render();
  setEstado("estado", `${REGRAS.length} regra(s)`, "ok");
}

/* --------------------------------------------------------------- eventos */

function ligar() {
  // Nova regra aberta da aba Ignorar já vem com "tirar dos cálculos".
  el("btnNova").addEventListener("click", () => abrirModal(null, { ignorar: aba === "ignorar" }));
  el("abas").addEventListener("click", e => {
    const b = e.target.closest("[data-aba]");
    if (!b) return;
    aba = b.dataset.aba;
    guardarUrl();
    render();
  });
  el("busca").addEventListener("input", () => {
    busca = el("busca").value;
    guardarUrl();
    render();
  });
  // "/" leva para a busca, como nos buscadores de sempre.
  document.addEventListener("keydown", e => {
    if (e.key === "/" && el("modal").hidden && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) {
      e.preventDefault();
      el("busca").focus();
    }
  });
  const caixa = el("modal").querySelector(".modal");
  caixa.addEventListener("input", agendarPrevia);
  caixa.addEventListener("change", agendarPrevia);
  caixa.addEventListener("click", e => {
    if (e.target.closest("[data-remove-termo]")) setTimeout(agendarPrevia);
  });
  el("btnAddTermo").addEventListener("click", () => criarLinhaTermo("", true).focus());
  el("fTermos").addEventListener("click", e => {
    const remover = e.target.closest("[data-remove-termo]");
    // Sem termo nenhum a regra nao casa com nada, entao a ultima linha fica.
    if (remover && el("fTermos").querySelectorAll(".termo-linha").length > 1) {
      remover.closest(".termo-linha")?.remove();
    }
  });
  el("btnFechar").addEventListener("click", fecharModal);
  el("btnCancelar").addEventListener("click", fecharModal);
  el("btnSalvar").addEventListener("click", salvar);
  el("modal").addEventListener("click", e => { if (e.target.id === "modal") fecharModal(); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !el("modal").hidden) fecharModal();
  });

  el("lista").addEventListener("change", async e => {
    const t = e.target.closest("[data-alterna]");
    if (!t) return;
    const r = REGRAS.find(x => x.id === t.dataset.alterna);
    try {
      await pedir(`/extrato/regras/${encodeURIComponent(r.id)}`, "PUT", {
        nome: r.nome, campo: r.campo, operador: r.operador, termo: r.termo,
        termos: r.termos,
        valorMin: r.valorMin, valorMax: r.valorMax,
        categoriaId: r.categoriaId, descricaoNova: r.descricaoNova,
        ignorarCalculos: r.ignorarCalculos,
        prioridade: r.prioridade, ativo: t.checked,
      });
      await recarregar();
    } catch (err) { setEstado("estado", err.message, "erro"); }
  });

  el("lista").addEventListener("click", e => {
    const b = e.target.closest("[data-menu]");
    if (!b) return;
    regraDoMenu = REGRAS.find(r => r.id === b.dataset.menu);
    el("popAcoesLista").innerHTML = `
      <button class="pop-item" data-acao="editar">✎  Editar</button>
      <button class="pop-item" data-acao="duplicar">⧉  Duplicar</button>
      <div class="pop-sep"></div>
      <button class="pop-item" data-acao="remover" style="color:var(--vermelho)">Excluir</button>`;
    abrirPop(el("popAcoes"), b, { alinhar: "direita" });
  });

  el("popAcoesLista").addEventListener("click", async e => {
    const b = e.target.closest("[data-acao]");
    if (!b || !regraDoMenu) return;
    const r = regraDoMenu;
    fecharPop();

    if (b.dataset.acao === "editar") return abrirModal(r);
    if (b.dataset.acao === "duplicar") {
      return abrirModal(null, { nome: `${r.nome} (cópia)`, campo:r.campo,
        operador:r.operador, termo:r.termo, termos:r.termos,
        valorMin:r.valorMin, valorMax:r.valorMax,
        categoriaId:r.categoriaId, descricaoNova:r.descricaoNova,
        ignorar:r.ignorarCalculos });
    }
    const aviso = `Excluir “${r.nome}”? As ${r.afetadas} transações voltam à categoria automática.`;
    if (!window.confirm(aviso)) return;
    try {
      await pedir(`/extrato/regras/${encodeURIComponent(r.id)}`, "DELETE");
      await recarregar();
    } catch (err) { setEstado("estado", err.message, "erro"); }
  });
}

/* Aba e busca na URL: recarregar ou mandar o link abre no mesmo lugar. */
function guardarUrl() {
  const url = new URL(location.href);
  if (aba === "todas") url.searchParams.delete("aba"); else url.searchParams.set("aba", aba);
  if (busca.trim()) url.searchParams.set("q", busca.trim()); else url.searchParams.delete("q");
  history.replaceState(null, "", url);
}

(async function iniciar() {
  const inicial = new URLSearchParams(location.search);
  if (ABAS.some(a => a.id === inicial.get("aba"))) aba = inicial.get("aba");
  busca = inicial.get("q") || "";
  el("busca").value = busca;
  montarNav("extrato_regras.html");
  ligar();
  try {
    CATEGORIAS = (await pedir("/extrato/categorias")).categorias || [];
    el("fCategoria").innerHTML = ['<option value="">Não alterar a categoria</option>']
      .concat(CATEGORIAS.map(c =>
        `<option value="${esc(c.id)}">${c.paiId ? "    " : ""}${esc(c.nome)}</option>`)).join("");
    await recarregar();

    // Veio do menu de ações de uma transação: abre o cadastro já preenchido.
    const url = new URLSearchParams(location.search);
    if (url.get("nova")) {
      abrirModal(null, { termo: url.get("termo") || "", ignorar: url.get("modo") === "ignorar" });
    }
  } catch (e) {
    setEstado("estado", `Backend fora do ar: ${e.message}`, "erro");
    el("vazio").innerHTML =
      `<div class="rg-nada">Suba o backend com <code>iniciar_pluggy.bat</code> e recarregue.</div>`;
  }
})();
</script>
